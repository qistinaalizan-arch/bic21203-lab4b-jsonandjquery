<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Book Information</title>
    </head>
    <body>
        <h1>Book Information</h1>
        <h2>First Book Title</h2>
        <p id="firstTitle"></p>

        <h2>Author of Second Book:</h2>
        <p id="secondAuthor"></p>

        <h2>Genres of both books:</h2>
        <div id="genres"></div>
        <p id="error"></p>

        <script>
            async function loadBooks(){
                try {
                    const response=await fetch("books.json");

                    if(!response.ok){
                        throw new Error("Failed to load JSON file.");
                    }

                    const data=await response.json();
                    document.getElementById("firstTitle")
                    .textContent=data.books[0].title;

                    document.getElementById("secondAuthor")
                    .textContent=data.books[1].author;

                    const genresDiv=document.getElementById("genres");

                    data.books.forEach(function(book){
                        const paragraph=document.createElement("p");
                        paragraph.textContent=book.title+" - "+book.genres.join(", ");

                        genresDiv.appendChild(paragraph);

                    });
                } catch(error) {
                    document.getElementById("error")
                    .textContent= "Unable to load book information. "+ 
                    "Please check the JSON file";
                }
            }
            loadBooks();
        </script>
    </body>
</html>
